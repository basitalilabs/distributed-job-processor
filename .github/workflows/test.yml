name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/jobs_test
      WEBHOOK_SECRET: ci-only-not-a-real-secret

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations on the test database
        run: |
          for file in $(ls migrations/*.sql | sort); do
            echo "Running $file"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run tests
        run: npm test